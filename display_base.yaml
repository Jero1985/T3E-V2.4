# HARDWARE
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway_ip
    subnet: !secret subnet_mask

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# =========================
# BUSSE
# =========================

i2c:
  - id: bus_a
    sda: GPIO07
    scl: GPIO06

spi:
  id: lcd_spi
  clk_pin: {number: GPIO15, allow_other_uses: true}
  mosi_pin: {number: GPIO48, allow_other_uses: true}

# =========================
# BACKLIGHT
# =========================

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO42
    frequency: 1000Hz

# =========================
# RELAIS (DEIN ORIGINAL)
# =========================

switch:
  - platform: gpio
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    id: relay_1
    name: "Flur Relais 1"


# =========================
# TOUCH HARDWARE
# =========================

touchscreen:
  - platform: gt911
    id: panel_touch
    display: tft_display
    i2c_id: bus_a
    address: 0x5D

    on_touch:
      - lambda: |-
          ESP_LOGD("touch", "touch detected");
          id(page) = (id(page) + 1) % 2;
          id(tft_display).update();


# =========================
# DISPLAY (DEIN STABILER SETUP)
# =========================

display:
  - platform: st7701s
    id: tft_display
    spi_id: lcd_spi

    dimensions: {width: 480, height: 480}

    color_order: RGB
    invert_colors: true

    auto_clear_enabled: false
    update_interval: never

    spi_mode: MODE3
    data_rate: 8MHz

    cs_pin: {number: GPIO4, allow_other_uses: true}
    reset_pin: {number: GPIO4, allow_other_uses: true}

    init_sequence:
      - 1

    # STABILES TIMING
    pclk_frequency: 12MHz
    pclk_inverted: false

    hsync_pulse_width: 8
    hsync_back_porch: 10
    hsync_front_porch: 50

    vsync_pulse_width: 8
    vsync_back_porch: 10
    vsync_front_porch: 20

    data_pins:
      red: [GPIO8, GPIO18, GPIO17, GPIO16, GPIO0]
      green: [GPIO13, GPIO12, GPIO11, GPIO10, GPIO9, GPIO3]
      blue:
        - {number: GPIO15, allow_other_uses: true}
        - {number: GPIO48, allow_other_uses: true}
        - GPIO47
        - GPIO21
        - GPIO14

    de_pin: GPIO40
    vsync_pin: GPIO39
    hsync_pin: GPIO38
    pclk_pin: GPIO41
